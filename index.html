<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F6F5F2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="My Vinyls">
  <title>My Vinyls</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- 登入 -->
  <section id="login" class="login" hidden>
    <form id="login-form" class="login-card" autocomplete="on">
      <div class="login-disc" aria-hidden="true"><span></span></div>
      <h1>我的唱片櫃</h1>
      <p class="muted">請輸入密碼開啟收藏</p>
      <label class="field">
        <span class="sr-only">密碼</span>
        <input id="login-pass" type="password" name="password" autocomplete="current-password" placeholder="密碼" required>
      </label>
      <button class="btn btn-ink btn-block" type="submit" id="login-btn">開啟</button>
      <p id="login-error" class="login-error" role="alert"></p>
    </form>
  </section>

  <!-- 主畫面 -->
  <div id="app" hidden>
    <main id="view" class="view" tabindex="-1"></main>

    <nav class="tabbar" aria-label="主選單">
      <a href="#/" data-tab="home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></svg>首頁
      </a>
      <a href="#/all" data-tab="all">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>全部收藏
      </a>
      <a href="#/add" data-tab="add">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3M8 9v6M11 9v6M14 9v6M17 9v6"/></svg>掃描新增
      </a>
      <a href="#/stats" data-tab="stats">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>統計
      </a>
    </nav>
  </div>

  <!-- 底部抽屜（編輯、確認等） -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-action="close-sheet"></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-grip" aria-hidden="true"></div>
      <div id="sheet-body"></div>
    </div>
  </div>

  <!-- 條碼掃描 -->
  <div id="scanner" class="scanner" hidden>
    <div class="scanner-top">
      <span>對準唱片背面的條碼</span>
      <button class="icon-btn icon-btn-light" data-action="close-scanner" aria-label="關閉掃描">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div id="scanner-region" class="scanner-region"></div>
    <p id="scanner-msg" class="scanner-msg"></p>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
